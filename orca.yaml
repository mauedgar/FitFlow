# Portable, informational-only workspace preparation.
# Select the native runtime in Orca; provision dependencies only for an authorized task.
scripts:
  setup: |
    echo "[FF] Workspace ready. Explicit task preparation required; dependencies and credentials are isolated."

# Keep the visible tab without binding a machine-specific root or starting an agent.
defaultTabs:
  - title: AI Core
    command: 'echo "[FF] Supply authorized FF_PROJECT_ROOT, FF_PROJECT_PROFILE and FF_AI_CORE_ROOT before running AI Core."'
