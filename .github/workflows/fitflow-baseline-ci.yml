name: FitFlow baseline deterministic CI

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop]

# Superseded in-flight PR attempts do not become evidence for a new SHA.
concurrency:
  group: fitflow-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Identify changed surfaces (always)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - name: Explicitly mark draft as NOT_RUN
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo "FITFLOW_NOT_RUN_DRAFT — set Ready for review to qualify candidate"
      - name: Checkout exact source candidate
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run bounded scope-classifier Git regression
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: python3 -m unittest discover -s scripts/ci -p test_fitflow_baseline_scope.py -v

      - name: Record subject SHA/tree and decide changed scope
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        id: paths
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          echo "FITFLOW_SUBJECT_SHA=$SUBJECT_SHA"
          echo "FITFLOW_SUBJECT_TREE=$(git rev-parse HEAD^{tree})"

          backend=false
          frontend=false
          from=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
            git fetch --no-tags origin "$BASE_SHA"
            from="$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            git fetch --no-tags origin "$BEFORE_SHA"
            from="$BEFORE_SHA"
          else
            # Unknown before/initial history: fail-safe full suite.
            backend=true
            frontend=true
          fi

          if [[ -n "$from" ]]; then
            changed_paths="$(mktemp)"
            trap 'rm -f "$changed_paths"' EXIT
            # Process substitution hides git-diff failures; check its exit code.
            git diff --name-only -z "$from" "$SUBJECT_SHA" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                backend/*|pyproject.toml|uv.lock|scripts/ci/*)
                  backend=true ;;
                frontend/*)
                  frontend=true ;;
                .github/workflows/*|scripts/quality/*)
                  backend=true
                  frontend=true ;;
                docs/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|README.md)
                  ;; # metadata/docs alone => explicitly N/A
                *)
                  # Unknown impact is conservatively both suites.
                  backend=true
                  frontend=true ;;
              esac
            done < "$changed_paths"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "FITFLOW_SCOPE backend=$backend frontend=$frontend"

  backend:
    name: Backend PostgreSQL/Redis (Python 3.11)
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: test
      TESTING: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-ci-disposable-only
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider --basetemp=/tmp/pytest"
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source SHA/tree
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          echo "BACKEND_SHA=$(git rev-parse HEAD)"
          echo "BACKEND_TREE=$(git rev-parse HEAD^{tree})"
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: backend/requirements_test.txt
      - name: Install existing backend test requirements
        run: python -m pip install -r backend/requirements_test.txt
      - name: Migrate disposable PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Backend regression
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend tests, lint and build (Node .nvmrc)
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source SHA/tree
        working-directory: .
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          echo "FRONTEND_SHA=$(git rev-parse HEAD)"
          echo "FRONTEND_TREE=$(git rev-parse HEAD^{tree})"
      - name: Node from repository and npm lock cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact existing frontend lock
        env:
          HUSKY: "0"
        run: npm ci --no-audit --no-fund
      - name: Frontend deterministic tests
        run: node --test tests/*.test.cjs
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck/build
        run: npm run build
