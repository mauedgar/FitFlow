name: ADMIN signed disposable browser E2E

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "frontend/src/**"
      - "frontend/tests/adminSignedE2E.cjs"
      - "backend/scripts/admin_e2e_seed.py"
      - ".github/workflows/admin-signed-e2e.yml"

permissions:
  contents: read

concurrency:
  group: admin-signed-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-admin-browser:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: test
      TESTING: "true"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-disposable-ci-e2e-signing-only
      REDIS_URL: redis://127.0.0.1:6379/0
      BACKEND_CORS_ORIGINS: '["http://127.0.0.1:5173"]'
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      FITFLOW_E2E_SYNTHETIC_ONLY: "1"
      FITFLOW_E2E_ADMIN_EMAIL: admin-fitflow@example.com
      FITFLOW_E2E_CLIENT_EMAIL: client-fitflow@example.com
      FITFLOW_E2E_PASSWORD: FitFlow-Disposable-E2E-Only-42
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head, no credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify frozen Git identity and disposable-only contract
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "${ENV}" = test
          test "${FITFLOW_E2E_SYNTHETIC_ONLY}" = 1
          echo "ADMIN_E2E_SHA=$(git rev-parse HEAD)"
          echo "ADMIN_E2E_TREE=$(git rev-parse HEAD^{tree})"
      - name: Python 3.11 pinned as current backend CI
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: backend/requirements_test.txt
      - name: Install existing backend lock constraints
        run: python -m pip install -r backend/requirements_test.txt
      - name: Alembic on empty disposable test database
        working-directory: backend
        run: alembic upgrade head
      - name: Seed only synthetic ADMIN, client, teacher and class in isolated DB
        working-directory: backend
        run: python -m scripts.admin_e2e_seed
      - name: Node version from frontend .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend plus ephemeral browser driver
        working-directory: frontend
        env:
          HUSKY: "0"
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Real signed browser route, auth, privacy and responsive E2E
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/ff-admin-api.log 2>&1 &
          api_pid=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) > /tmp/ff-admin-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; rm -f /tmp/fitflow-admin-e2e-expired.jwt' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/health/ready >/dev/null &&
               curl --silent --fail http://127.0.0.1:5173/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:8000/health/ready >/dev/null
          curl --silent --show-error --fail http://127.0.0.1:5173/login >/dev/null
          (cd frontend && node tests/adminSignedE2E.cjs)
          test "$(git status --porcelain --untracked-files=all)" = ""
