name: FitFlow Python compatibility and quality qualification TEMP asyncpg-0.32.0
on:
  push:
    branches: [chore/fitflow-python-deps-normalize-20261101-001]
    paths: ['.github/workflows/fitflow-python-matrix-temp.yml']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Install locked tools and exercise existing quality commands
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements_test.txt
          set +e
          python -m ruff check .
          ruff_status=$?
          pyright .
          pyright_status=$?
          echo "FF_QUALITY_RESULT ruff=${ruff_status} pyright=${pyright_status}"
          test "$ruff_status" -eq 0 && test "$pyright_status" -eq 0
  compat:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.17', '3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: test
      TESTING: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-test-only-secret-key
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/tmp/pytest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements_test.txt
      - name: Alembic isolated test DB
        working-directory: backend
        run: alembic upgrade head
      - name: Backend complete API + unit + DB suite
        working-directory: backend
        run: python -m pytest -q
