name: FitFlow bounded uv dependency regeneration (temporary)
on:
  push:
    branches: [chore/fitflow-python-deps-normalize-20261101-001]
    paths: ['.github/workflows/fitflow-export-runtime-temp.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Re-lock actual asyncpg and export runtime/test dependency sets
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check uv==0.13.6
          uv lock --upgrade
          uv lock --check
          uv export --locked --no-dev --format requirements.txt --output-file backend/requirements_backend.txt
          uv export --locked --group dev --format requirements.txt --output-file backend/requirements_test.txt
          if grep -Eiq '^(pytest|pytest-asyncio|ruff|pyright)==' backend/requirements_backend.txt; then echo DEV_DEP_IN_RUNTIME; exit 1; fi
          grep -q '^asyncpg==0.32.0' backend/requirements_backend.txt
      - name: Emit generation receipt and chunks
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          for name in ('uv.lock', 'backend/requirements_backend.txt', 'backend/requirements_test.txt'):
              c=Path(name).read_text(encoding='utf-8')
              print(f'FF_DEPS_BEGIN:{name}:{len(c)}')
              for i,pos in enumerate(range(0,len(c),1600)):
                  print(f'FF_DEPS_CHUNK:{name}:{i}:{json.dumps(c[pos:pos+1600],ensure_ascii=True)}')
              print(f'FF_DEPS_END:{name}:{hashlib.sha256(c.encode()).hexdigest()}')
          PY
