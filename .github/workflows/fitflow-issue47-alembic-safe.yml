name: FITFLOW Issue 47 isolated Alembic safe lint candidate
on:
  push:
    branches:
      - quality/fitflow-backend-ruff-pyright-20261102-001
    paths:
      - .github/workflows/fitflow-issue47-alembic-safe.yml
permissions:
  contents: write
jobs:
  alembic-safe:
    if: "github.event.head_commit.message == 'ci(issue47): repair workflow YAML parsing'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8efecd95e632f37b1aa9033be95404869a9710e8"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse HEAD^{tree})"
          test "$GITHUB_REF_NAME" = "quality/fitflow-backend-ruff-pyright-20261102-001"
          test -z "$(git status --porcelain)"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - name: Apply only Ruff safe autofixes in Alembic
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select I001,UP035,UP007,F401,PIE790 backend/alembic || true
          git diff --check
          git diff --stat
      - name: Verify migration identity and DDL/call graph invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert changed, "No safe fixes materialized"
          assert all(p.startswith("backend/alembic/") and p.endswith(".py") for p in changed), changed
          for path in changed:
              old = subprocess.check_output(["git", "show", f"HEAD:{path}"], text=True)
              new = Path(path).read_text()
              a, b = ast.parse(old), ast.parse(new)
              def identity(tree):
                  out = {}
                  for node in tree.body:
                      if isinstance(node, (ast.Assign, ast.AnnAssign)):
                          names = [t.id for t in node.targets if isinstance(t, ast.Name)] if isinstance(node, ast.Assign) else ([node.target.id] if isinstance(node.target, ast.Name) else [])
                          for name in names:
                              if name in ("revision", "down_revision", "branch_labels", "depends_on"):
                                  out[name] = ast.literal_eval(node.value)
                  return out
              assert identity(a) == identity(b), f"Revision identity changed: {path}"
              def effect_calls(tree):
                  out = {}
                  for node in tree.body:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in ("upgrade", "downgrade"):
                          out[node.name] = [
                              ast.dump(call, include_attributes=False)
                              for call in ast.walk(node)
                              if isinstance(call, ast.Call)
                          ]
                  return out
              assert effect_calls(a) == effect_calls(b), f"Migration effect-call graph changed: {path}"
              print("ALEMBIC_SOURCE_INVARIANTS_PASS", path)
          print("ALEMBIC_SAFE_FIX_CANDIDATE_PASS", len(changed))
          PY
      - name: Commit isolated migration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/alembic
          git commit -m "style(alembic): apply Ruff safe-only historical lint fixes [quality47]"
          git push origin HEAD:quality/fitflow-backend-ruff-pyright-20261102-001
          echo "ALEMBIC_CANDIDATE_COMMITTED=$(git rev-parse HEAD)"
