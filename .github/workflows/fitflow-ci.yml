name: "FitFlow Automated Skills"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  run-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Permite a Git calcular el diff comparando con el commit anterior

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Ejecutar Revisor de Arquitectura LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # En GitHub Actions, obtenemos el Diff de los cambios del commit actual
          python scripts/tools/llm_reviewer.py
