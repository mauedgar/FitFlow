name: "FitFlow Automated Skills"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  run-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Permite a Git calcular el diff comparando con el commit anterior

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Ejecutar Revisor de Arquitectura LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # En GitHub Actions, obtenemos el Diff de los cambios del commit actual
          python scripts/tools/llm_reviewer.py
