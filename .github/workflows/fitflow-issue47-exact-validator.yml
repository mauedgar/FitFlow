name: FitFlow Issue47 exact candidate validation
on:
  push:
    branches: [ci/fitflow-issue49-final-validation-20261102-001]
    paths: ['.github/workflows/fitflow-issue47-exact-validator.yml']
permissions:
  contents: read
jobs:
  quality-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: dc927d8f8865d08216d249719d2c839ecf287f76
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Guard exact candidate identity and diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc927d8f8865d08216d249719d2c839ecf287f76"
          test "$(git rev-parse HEAD^{tree})" = "d1db3682bae72cd176b3ad18b713e8b61c1cd7c1"
          git diff --check bbff13146684ebe323ff89de6d70e21fca5dfcd2 HEAD
          echo EXACT_CANDIDATE_GUARD_PASS
      - name: Analyze remaining Ruff and Pyright diagnostics exactly
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check -r backend/requirements_test.txt
          python -m pip install --no-cache-dir --disable-pip-version-check ruff==0.17.3 pyright==1.1.414
          set +e
          python -m ruff check backend --output-format concise > /tmp/ff-ruff.txt 2>&1
          rc_ruff=$?
          (cd backend && pyright .) > /tmp/ff-pyright.txt 2>&1
          rc_pyright=$?
          echo 'FF_ISSUE47_RUFF_BEGIN'
          cat /tmp/ff-ruff.txt
          echo 'FF_ISSUE47_RUFF_END'
          echo 'FF_ISSUE47_PYRIGHT_BEGIN'
          cat /tmp/ff-pyright.txt
          echo 'FF_ISSUE47_PYRIGHT_END'
          echo "FF_ISSUE47_QUALITY_STATUS ruff=$rc_ruff pyright=$rc_pyright"
          test "$rc_ruff" -eq 0 && test "$rc_pyright" -eq 0
  migration-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: dc927d8f8865d08216d249719d2c839ecf287f76
          fetch-depth: 0
      - name: Assert historical revision graph and migration calls unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          base = "bbff13146684ebe323ff89de6d70e21fca5dfcd2"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == "dc927d8f8865d08216d249719d2c839ecf287f76"
          old_paths = set(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", base, "--", "backend/alembic/versions"], text=True).splitlines())
          new_paths = set(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD", "--", "backend/alembic/versions"], text=True).splitlines())
          assert old_paths == new_paths, "Migration files deleted/added"
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD", "--", "backend/alembic"], text=True).splitlines()
          def identity(tree):
              result = {}
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      names = [t.id for t in node.targets if isinstance(t, ast.Name)] if isinstance(node, ast.Assign) else ([node.target.id] if isinstance(node.target, ast.Name) else [])
                      for name in names:
                          if name in ("revision", "down_revision", "branch_labels", "depends_on"):
                              result[name] = ast.literal_eval(node.value)
              return result
          def calls(tree):
              return {
                  node.name: [ast.dump(n, include_attributes=False) for n in ast.walk(node) if isinstance(n, ast.Call)]
                  for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in ("upgrade", "downgrade")
              }
          for path in changed:
              a = ast.parse(subprocess.check_output(["git", "show", f"{base}:{path}"], text=True))
              b = ast.parse(Path(path).read_text())
              assert identity(a) == identity(b), f"Revision identity drift: {path}"
              assert calls(a) == calls(b), f"DDL/call drift: {path}"
          print("ALEMBIC_HISTORY_AND_CALL_GRAPH_PASS", len(changed))
          PY
  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: test
      TESTING: 'true'
      DEBUG: 'false'
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-test-only-secret-key
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/tmp/pytest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: dc927d8f8865d08216d249719d2c839ecf287f76
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Guard exact test subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc927d8f8865d08216d249719d2c839ecf287f76"
          test "$(git rev-parse HEAD^{tree})" = "d1db3682bae72cd176b3ad18b713e8b61c1cd7c1"
      - name: Install existing baseline pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements_test.txt
      - name: Migrate isolated test database
        working-directory: backend
        run: alembic upgrade head
      - name: Full regression
        working-directory: backend
        run: python -m pytest -q
