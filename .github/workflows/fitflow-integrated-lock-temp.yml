name: FitFlow integrated dependency lock and export generator TEMP
on:
  push:
    branches: [integration/fitflow-issue44-quality-auth-20261102-001]
    paths: ['.github/workflows/fitflow-integrated-lock-temp.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Rebuild one authoritative Python dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check uv==0.13.6
          grep -q '^requires-python = ">=3.11,<3.14"' pyproject.toml
          grep -q '"bcrypt==4.3.0"' pyproject.toml
          grep -q '"asyncpg==0.32.0"' pyproject.toml
          if grep -iq passlib pyproject.toml; then echo BLOCKED_PASSLIB; exit 2; fi
          uv lock --upgrade
          uv lock --check
          uv export --locked --no-dev --format requirements.txt --output-file backend/requirements_backend.txt
          uv export --locked --group dev --format requirements.txt --output-file backend/requirements_test.txt
          grep -q '^bcrypt==4.3.0' backend/requirements_backend.txt
          grep -q '^asyncpg==0.32.0' backend/requirements_backend.txt
          if grep -Eiq '^(passlib|pytest|pytest-asyncio|ruff|pyright)==' backend/requirements_backend.txt; then exit 2; fi
      - name: Emit exact derived text and SHA256 in chunks (CI no writes)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          for name in ('uv.lock','backend/requirements_backend.txt','backend/requirements_test.txt'):
              value=Path(name).read_text(encoding='utf-8')
              print(f'FF_INTEGRATED_BEGIN:{name}:{len(value)}')
              for i,pos in enumerate(range(0,len(value),1600)):
                  print(f'FF_INTEGRATED_CHUNK:{name}:{i}:{json.dumps(value[pos:pos+1600],ensure_ascii=True)}')
              print(f'FF_INTEGRATED_END:{name}:{hashlib.sha256(value.encode()).hexdigest()}')
          PY
