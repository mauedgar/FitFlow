name: "Issue52 IR001 security and self-profile repair exact candidate"

on:
  push:
    branches: [security/fitflow-pr52-ir001-repair-20261102-001]
  pull_request:
    branches: [develop]
    paths:
      - backend/**
      - frontend/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/issue52-ir001-repair-verify.yml
      - docs/quality/issue-52-ir001-repair-docimpact-20261102.md

permissions:
  contents: read

env:
  ENV: test
  TESTING: "true"
  DEBUG: "false"
  SECRET_KEY: fitflow-issue52-disposable-ci-only
  DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
  REDIS_URL: redis://127.0.0.1:6379/0
  MEDIA_DIR: /tmp/fitflow-media
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_ADDOPTS: "-p no:cacheprovider --basetemp=/tmp/pytest"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15.2"]
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Exact candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Immutable subject guard
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          echo "ISSUE52_SHA=$SUBJECT"
          echo "ISSUE52_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Lock authority
        run: |
          set -euo pipefail
          uv lock --check --no-progress
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)
          with open("uv.lock", "rb") as f:
              lock = tomllib.load(f)
          deps = project["project"]["dependencies"]
          pkgs = {p["name"]: p["version"] for p in lock["package"]}
          assert project["project"]["requires-python"] == ">=3.15,<3.16"
          assert "bcrypt==4.3.0" in deps and "asyncpg==0.32.0" in deps
          assert pkgs["bcrypt"] == "4.3.0" and pkgs["asyncpg"] == "0.32.0"
          assert "passlib" not in pkgs
          print("ISSUE52_LOCK_PASS")
          PY
      - name: Install pinned backend requirements
        run: |
          uv pip install --system --no-cache-dir -r backend/requirements_test.txt
          python -m pip check
      - name: Bootstrap isolated PG15 Alembic
        working-directory: backend
        run: alembic upgrade head
      - name: Complete backend regression including PG row locks and real HTTP
        working-directory: backend
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact candidate guard
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          echo "ISSUE52_QUALITY_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Install type dependencies
        run: uv pip install --system --no-cache-dir -r backend/requirements_test.txt
      - name: Full Ruff
        run: uvx --from ruff==0.17.3 ruff check backend
      - name: Full Pyright
        env:
          PYTHONPATH: backend
        run: uvx --from pyright==1.1.414 pyright --pythonpath "$(command -v python)" backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact candidate guard
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          echo "ISSUE52_FRONTEND_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Login and registration route contracts
        working-directory: frontend
        run: node --test tests/issue52LoginRoute.test.cjs tests/issue43RegistrationError.test.cjs tests/registerSensitiveLog.test.cjs
      - name: Frontend TypeScript/Vite
        working-directory: frontend
        run: npm run build
