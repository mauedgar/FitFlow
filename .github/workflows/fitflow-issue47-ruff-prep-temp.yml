name: FitFlow Issue47 bounded Ruff autofix candidate
on:
  push:
    branches: [quality/fitflow-backend-ruff-pyright-20261102-001]
    paths: ['.github/workflows/fitflow-issue47-ruff-prep-temp.yml']
permissions:
  contents: write
jobs:
  safe-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.17'
      - name: Verify immutable branch precondition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c15bdefc766dfa42fa2b5b86b679ed3bf0f5a47d
          test "$(git show HEAD:.github/workflows/fitflow-issue47-ruff-prep-temp.yml | wc -l)" -gt 20
          echo "FF_ISSUE47_ORIGINAL_PARENT=$(git rev-parse HEAD^)"
      - name: Apply Ruff safe deterministic mechanical transforms only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.17.3
          python -m ruff check backend --fix --select I001,UP007,UP017,UP035,UP037,RUF100 --unsafe-fixes=false --exit-zero
          git diff --check
          python -m compileall -q backend
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              case "$path" in
                backend/app/*.py|backend/app/*/*.py|backend/tests/*/*.py|backend/alembic/env.py|backend/alembic/versions/*.py|backend/*.py) ;;
                *) echo "BLOCKED_UNEXPECTED_PATH:$path"; exit 2 ;;
              esac
            done <<< "$changed"
          fi
          echo FF_ISSUE47_CHANGED_FILES_START
          git diff --name-only
          echo FF_ISSUE47_CHANGED_FILES_END
          git diff --stat
      - name: Commit only mechanical fixes to isolated Issue47 branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend; then echo FF_ISSUE47_NO_CHANGES; exit 0; fi
          git config user.name 'fitflow-ci-bot'
          git config user.email 'fitflow-ci-bot@users.noreply.github.com'
          git add -- backend
          git commit -m 'style(quality): safe Ruff fixes isolated from Product dependency candidate (#47)'
          git push origin HEAD:refs/heads/quality/fitflow-backend-ruff-pyright-20261102-001
          echo "FF_ISSUE47_SAFE_FIX_COMMIT=$(git rev-parse HEAD)"
