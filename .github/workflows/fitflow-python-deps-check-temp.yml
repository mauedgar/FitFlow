name: FitFlow temporary Python dependency compatibility check
on:
  push:
    branches:
      - chore/fitflow-python-deps-normalize-20261101-001
    paths:
      - '.github/workflows/fitflow-python-deps-check-temp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ENV: test
      TESTING: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-test-only-secret-key
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/tmp/pytest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.17"
      - name: Verify committed uv lock against project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.13.6
          uv lock --check
          uv export --locked --group dev --format requirements.txt --output-file /tmp/fitflow-requirements.txt
          # The uv export header records its output path; compare semantic content only.
          head -n 1 /tmp/fitflow-requirements.txt | grep -Fx '# This file was autogenerated by uv via the following command:'
          head -n 1 backend/requirements_test.txt | grep -Fx '# This file was autogenerated by uv via the following command:'
          diff -u <(tail -n +3 /tmp/fitflow-requirements.txt) <(tail -n +3 backend/requirements_test.txt)
      - name: Install hashed test requirements
        run: python -m pip install --disable-pip-version-check -r backend/requirements_test.txt
      - name: Bootstrap isolated test schema
        working-directory: backend
        run: alembic upgrade head
      - name: Run complete FitFlow backend tests with updated dev dependencies
        working-directory: backend
        run: python -m pytest -q
