name: FitFlow one-shot uv lock preparation (candidate only)
on:
  push:
    branches:
      - chore/fitflow-python-deps-normalize-20261101-001
    paths:
      - .github/workflows/fitflow-uv-lock-prep-temp.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.17'
      - name: Resolve with pinned uv in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.13.6
          uv lock --upgrade
          uv lock --check
          uv export --locked --group dev --format requirements.txt --output-file backend/requirements_test.txt
      - name: Print reproducible generated contents for bounded source return
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ('uv.lock', 'backend/requirements_test.txt'):
              contents = Path(name).read_text(encoding='utf-8')
              print(f'FFLOCK_BEGIN:{name}:{len(contents)}')
              for index, offset in enumerate(range(0, len(contents), 1800)):
                  print(f'FFLOCK_CHUNK:{name}:{index}:{json.dumps(contents[offset:offset+1800], ensure_ascii=True)}')
              digest = hashlib.sha256(contents.encode('utf-8')).hexdigest()
              print(f'FFLOCK_END:{name}:{digest}')
          PY
