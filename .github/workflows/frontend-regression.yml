name: FitFlow frontend deterministic regression

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-regression.yml'
  # Required checks must not remain Pending on documentation/backend-only PRs.
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record checked-out subject
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          echo "subject_commit=$observed"
          echo "subject_tree=$tree"
          test "$observed" = "$GITHUB_SHA"

      - name: Set up pinned Node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install existing lockfile
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund

      - name: Run deterministic frontend tests
        run: node --test tests/*.test.cjs

      - name: Lint frontend
        run: npm run lint

      - name: Build and typecheck frontend
        run: npm run build
