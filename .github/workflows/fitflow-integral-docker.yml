name: FitFlow integral exact Docker build and smoke
on:
  push:
    branches: [ci/fitflow-integral-exact-20261102-001]
    paths: ['.github/workflows/fitflow-integral-docker.yml']
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cdfb61a32bf3ed2443656a1b4625eac91a7b7e7e
          persist-credentials: false
      - name: Guard exact product source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = cdfb61a32bf3ed2443656a1b4625eac91a7b7e7e
          test "$(git rev-parse 'HEAD^{tree}')" = da941bd3c6af56f51b7bf4e3da25706b560311f2
      - name: Build current production container
        run: docker build --tag fitflow-issue44-runtime:test --file Dockerfile .
      - name: Build current test container
        run: docker build --tag fitflow-issue44-tests:test --file backend/Dockerfile.test .
      - name: Smoke importing production runtime, no external DB
        run: |
          docker run --rm --network none --workdir /app/backend --entrypoint /app/.venv/bin/python -e ENV=test -e TESTING=true -e SECRET_KEY=fitflow-test-only-secret-key -e DATABASE_URL=postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test fitflow-issue44-runtime:test -c "import app.main; print('FF_RUNTIME_IMAGE_IMPORT_PASS')"
      - name: Smoke test image imports
        run: |
          docker run --rm --network none --workdir /app/backend --entrypoint python fitflow-issue44-tests:test -c "import pytest, asyncpg, fastapi; print('FF_TEST_IMAGE_IMPORT_PASS')"
