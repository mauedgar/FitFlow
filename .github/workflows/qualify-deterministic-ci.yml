name: Qualify repaired FitFlow deterministic validation v0

on:
  push:
    branches:
      - devlab/fitflow-actions-validation-binding-v0-schema-bootstrap-repair-qualification-001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      ENV: test
      TESTING: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-test-only-secret-key
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/tmp/pytest

    steps:
      - name: Checkout exact repaired FitFlow candidate
        uses: actions/checkout@v4
        with:
          ref: dd1d901cf661236fc0c7abb0e6ccf44714613dd5
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          observed_commit="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$observed_commit" = "dd1d901cf661236fc0c7abb0e6ccf44714613dd5"
          test "$observed_tree" = "f8af24d13d67577e3155083f8a1dd333754eda2a"
          echo "EXACT_REPAIRED_CANDIDATE=$observed_commit"
          echo "EXACT_REPAIRED_TREE=$observed_tree"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements_test.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements_test.txt

      - name: Bootstrap fresh database schema
        working-directory: backend
        run: alembic upgrade head

      - name: Record Alembic current revision
        working-directory: backend
        run: alembic current

      - name: Run exact repaired candidate deterministic validation
        id: validation
        continue-on-error: true
        env:
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          python scripts/ci/fitflow_deterministic_validation.py             --repository "$GITHUB_REPOSITORY"             --subject-sha "dd1d901cf661236fc0c7abb0e6ccf44714613dd5"             --expected-tree "f8af24d13d67577e3155083f8a1dd333754eda2a"             --request-output "$RECEIPT_DIR/request.json"             --receipt-output "$RECEIPT_DIR/receipt.json"

      - name: Checkout exact pinned Tecnotron contract
        if: always()
        uses: actions/checkout@v4
        with:
          repository: mauedgar/tecnotron-ai
          ref: f28c812cff4d9c6dd27d71a084fbccfffbadd735
          path: .tecnotron-contract-v0
          persist-credentials: false

      - name: Guard pinned Tecnotron contract
        if: always()
        working-directory: .tecnotron-contract-v0
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "f28c812cff4d9c6dd27d71a084fbccfffbadd735"
          echo "PINNED_TECNOTRON_CONTRACT=$observed"

      - name: Set up Node 22
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned contract runtime
        if: always()
        working-directory: .tecnotron-contract-v0
        run: npm ci --ignore-scripts --omit=dev

      - name: Validate portable request and receipt
        if: always()
        env:
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const contract = require('./.tecnotron-contract-v0/src/contracts/deterministic-validation');
          const dir = process.env.RECEIPT_DIR;
          const request = JSON.parse(fs.readFileSync(`${dir}/request.json`, 'utf8'));
          const receipt = JSON.parse(fs.readFileSync(`${dir}/receipt.json`, 'utf8'));
          contract.DeterministicValidationRequest.parse(request);
          contract.DeterministicValidationReceipt.parse(receipt);
          console.log('REQUEST_SCHEMA=' + request.schema_version);
          console.log('RECEIPT_SCHEMA=' + receipt.schema_version);
          console.log('PORTABLE_CONTRACT_VALIDATION_PASS');
          NODE

      - name: Upload deterministic validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-deterministic-validation-dd1d901cf661236fc0c7abb0e6ccf44714613dd5
          path: ${{ runner.temp }}/fitflow-deterministic-validation
          if-no-files-found: error
          retention-days: 30

      - name: Propagate validation conclusion
        if: always()
        env:
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RECEIPT_DIR"]) / "receipt.json").read_text(encoding="utf-8"))
          print("VALIDATION_CONCLUSION=" + str(receipt.get("conclusion")))
          raise SystemExit(0 if receipt.get("conclusion") == "PASS" else 1)
          PY
