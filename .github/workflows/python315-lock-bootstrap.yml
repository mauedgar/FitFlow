name: FitFlow Python315 uv lock bootstrap isolated

on:
  push:
    branches: [migration/fitflow-python315-20261104-001]
    paths:
      - pyproject.toml
      - .python-version
      - .github/workflows/python315-lock-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: fitflow-python315-locked-bootstrap
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and export Python315 once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Freeze Git identity and Product authority
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$BRANCH" = migration/fitflow-python315-20261104-001
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          git merge-base --is-ancestor 4be0b32822a5cd2272db96b6402853804ef089b1 HEAD
          test "$(git hash-object docs/SOURCE_OF_TRUTH.md)" = f36307af0777fd3b493792ad42115fec56ac44b3
          test "$(cat .python-version)" = 3.15.2
          echo "PY315_BOOTSTRAP_SUBJECT=$SUBJECT_SHA"
          echo "PY315_BOOTSTRAP_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install exact CPython 3.15.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Setup uv 0.13.6
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
      - name: Resolve on CPython315 and regenerate all derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          python --version
          uv --version
          uv lock --upgrade --no-progress
          uv export --locked --no-dev --format requirements.txt --output-file backend/requirements_backend.txt
          uv export --locked --group dev --format requirements.txt --output-file backend/requirements_test.txt
          uv lock --check --no-progress
          uv sync --locked --group dev --python 3.15.2
          uv run --locked python -c 'import sys, fastapi, pydantic, pydantic_core, sqlalchemy, asyncpg, greenlet, bcrypt; assert sys.version_info[:3] == (3,15,2); print("PY315_IMPORTS_PASS")'
          uv pip check --python .venv/bin/python
          sha256sum pyproject.toml uv.lock backend/requirements_backend.txt backend/requirements_test.txt
      - name: Verify exclusive generated write-set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' backend/requirements_backend.txt backend/requirements_test.txt uv.lock | LC_ALL=C sort)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit generated uv artifacts once on isolated branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- uv.lock backend/requirements_backend.txt backend/requirements_test.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): generate Python 3.15 uv lock and exports [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "PY315_GENERATED_COMMIT=$(git rev-parse HEAD)"
          echo "PY315_GENERATED_TREE=$(git rev-parse HEAD^{tree})"
          echo PY315_LOCK_GENERATION_PUBLISHED
