name: Validate migration schema artifact

on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  push:
    branches:
      - develop
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic CI-only values, never from real/staging accounts.
      DATABASE_URL: postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/fitflow_db
      SECRET_KEY: fitflow-ci-only-signing-key
      ENV: test
      TESTING: "true"
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_db
          POSTGRES_USER: fitflow_admin
          POSTGRES_PASSWORD: fitflow-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_admin -d fitflow_db"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact event revision (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11.17
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.17"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"

      - name: Install backend dependencies for develop baseline
        run: |
          set -euo pipefail
          uv pip install --system --no-cache-dir -r backend/requirements_backend.txt
          python -m pip check

      - name: Upgrade disposable PostgreSQL to exact Alembic head
        working-directory: backend
        run: alembic upgrade head

      - name: Negative proof — retain data and Alembic revision on populated pre-refactor PG15
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/fitflow_guard
        run: |
          set -euo pipefail
          # Only the disposable GitHub Actions service. No staging or external DB.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          with create_engine(url.set(database="postgres"), isolation_level="AUTOCOMMIT").connect() as c:
              c.execute(text("CREATE DATABASE fitflow_guard"))
          PY
          (cd backend && alembic upgrade a2b62b427037)
          # Real legacy target from the pre-refactor schema; no unrelated
          # sentinel table that could be detected first by the catalog scan.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).begin() as c:
              c.execute(text("""
                  INSERT INTO gym_classes (id, name, description, duration_minutes, default_capacity)
                  VALUES ('00000000-0000-0000-0000-000000000071',
                          'Guard fixture', 'Discardable CI', 45, 8)
              """))
          PY
          if (cd backend && alembic upgrade head) > "$RUNNER_TEMP/fitflow-negative-migration.log" 2>&1; then
            echo "FAIL: populated direct Product table was upgraded" >&2
            exit 1
          fi
          grep -q 'nonempty table "public"."gym_classes"' "$RUNNER_TEMP/fitflow-negative-migration.log"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).connect() as c:
              revision = c.scalar(text("SELECT version_num FROM alembic_version"))
              count = c.scalar(text("SELECT count(*) FROM gym_classes"))
          assert revision == "a2b62b427037", revision
          assert count == 1, count
          print("FAIL_CLOSED_PG15_DIRECT_TARGET_PASS")
          PY
          # A real FK child is a potential TRUNCATE CASCADE target even with
          # its own rows; the refusal must preserve the entire dependency.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).begin() as c:
              c.execute(text("""
                  CREATE TABLE core_refactor_guard_child (
                      id integer PRIMARY KEY,
                      gym_class_id uuid NOT NULL REFERENCES gym_classes(id)
                  )
              """))
              c.execute(text("""
                  INSERT INTO core_refactor_guard_child (id, gym_class_id)
                  VALUES (1, '00000000-0000-0000-0000-000000000071')
              """))
          PY
          if (cd backend && alembic upgrade head) > "$RUNNER_TEMP/fitflow-negative-fk.log" 2>&1; then
            echo "FAIL: retained FK-dependent Product data was upgraded" >&2
            exit 1
          fi
          grep -q "f5453ed20cdc refuses to discard retained Product data" "$RUNNER_TEMP/fitflow-negative-fk.log"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).connect() as c:
              revision = c.scalar(text("SELECT version_num FROM alembic_version"))
              parent_count = c.scalar(text("SELECT count(*) FROM gym_classes"))
              child_count = c.scalar(text("SELECT count(*) FROM core_refactor_guard_child"))
          assert revision == "a2b62b427037", revision
          assert parent_count == 1, parent_count
          assert child_count == 1, child_count
          print("FAIL_CLOSED_PG15_FK_CASCADE_RETENTION_PASS")
          PY
          # Role is not a superuser. The database owner is deliberately
          # distinct from the CI bootstrap cluster administrator.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          with create_engine(url.set(database="postgres"), isolation_level="AUTOCOMMIT").connect() as c:
              c.execute(text("CREATE ROLE fitflow_ci_migrator LOGIN PASSWORD 'fitflow-ci-migrator-only'"))
              c.execute(text("CREATE DATABASE fitflow_ci_role OWNER fitflow_ci_migrator"))
          PY
          export DATABASE_URL='postgresql+psycopg2://fitflow_ci_migrator:fitflow-ci-migrator-only@127.0.0.1:5432/fitflow_ci_role'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).connect() as c:
              assert c.scalar(text("SELECT rolsuper FROM pg_roles WHERE rolname=current_user")) is False
              assert c.scalar(text("SELECT current_schema()")) == "public"
          PY
          (cd backend && alembic upgrade head)
          echo "PG15_NON_SUPERUSER_OWNER_MIGRATION_PASS"
          # RLS regression: a real non-superuser owner with FORCE RLS cannot
          # see retained gym_classes rows; the migration must still refuse DDL.
          export DATABASE_URL='postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/postgres'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT").connect() as c:
              c.execute(text("CREATE DATABASE fitflow_ci_rls OWNER fitflow_ci_migrator"))
          PY
          export DATABASE_URL='postgresql+psycopg2://fitflow_ci_migrator:fitflow-ci-migrator-only@127.0.0.1:5432/fitflow_ci_rls'
          (cd backend && alembic upgrade a2b62b427037)
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).begin() as c:
              assert c.scalar(text("SELECT rolsuper FROM pg_roles WHERE rolname=current_user")) is False
              c.execute(text("""
                  INSERT INTO gym_classes (id, name, description, duration_minutes, default_capacity)
                  VALUES ('00000000-0000-0000-0000-000000000072',
                          'RLS guard fixture', 'Discardable CI', 45, 8)
              """))
              c.execute(text("CREATE POLICY fitflow_guard_hide ON gym_classes FOR SELECT USING (false)"))
              c.execute(text("ALTER TABLE gym_classes ENABLE ROW LEVEL SECURITY"))
              c.execute(text("ALTER TABLE gym_classes FORCE ROW LEVEL SECURITY"))
              assert c.scalar(text("SELECT count(*) FROM gym_classes")) == 0
          PY
          if (cd backend && alembic upgrade head) > "$RUNNER_TEMP/fitflow-negative-rls.log" 2>&1; then
            echo "FAIL: FORCE RLS hidden retained Product data was upgraded" >&2
            exit 1
          fi
          grep -q 'f5453ed20cdc refuses RLS-enabled relation' "$RUNNER_TEMP/fitflow-negative-rls.log"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_URL"]).begin() as c:
              assert c.scalar(text("SELECT version_num FROM alembic_version")) == "a2b62b427037"
              assert c.scalar(text("SELECT count(*) FROM gym_classes")) == 0
              c.execute(text("ALTER TABLE gym_classes DISABLE ROW LEVEL SECURITY"))
              assert c.scalar(text("SELECT count(*) FROM gym_classes")) == 1
          print("FAIL_CLOSED_PG15_RLS_HIDDEN_ROW_RETENTION_PASS")
          PY

      - name: Generate reviewable schema with PostgreSQL 15 client, no Git write
        shell: bash
        env:
          PGPASSWORD: fitflow-ci-postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fitflow-schema"
          # A PG15 client matches disposable PG15 server (no runner-version drift).
          # Restrict guard keys MUST remain randomized in raw review artifacts.
          docker run --rm --network host --read-only --tmpfs /tmp postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump --version
          docker run --rm --network host --read-only --tmpfs /tmp -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema.sql"
          docker run --rm --network host --read-only --tmpfs /tmp -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql"
          # Compare SQL excluding ONLY the randomized psql restrict/unrestrict keys.
          # Never replace keys with a constant or remove them from the original dump.
          diff -u <(grep -vE '^\\(un)?restrict ' "$RUNNER_TEMP/fitflow-schema/schema.sql") <(grep -vE '^\\(un)?restrict ' "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql")
          test -s "$RUNNER_TEMP/fitflow-schema/schema.sql"
          (cd "$RUNNER_TEMP/fitflow-schema" && sha256sum schema.sql > schema.sha256)
          printf 'subject_sha=%s\nsubject_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/fitflow-schema/subject.txt"
          test -z "$(git status --porcelain)"
          echo "FF_SCHEMA_READONLY_NO_COMMIT_PASS"
          echo "FF_SCHEMA_SEMANTIC_COMPARISON_PASS"
          cat "$RUNNER_TEMP/fitflow-schema/subject.txt"
          cat "$RUNNER_TEMP/fitflow-schema/schema.sha256"

      - name: Publish schema.sql for reviewer, never auto-commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fitflow-schema-sql-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fitflow-schema/schema.sql
            ${{ runner.temp }}/fitflow-schema/schema.sha256
            ${{ runner.temp }}/fitflow-schema/subject.txt
          retention-days: 14
          if-no-files-found: error
