name: Update schema.sql after migrations

on:
  # Se activa cuando se suben nuevos archivos de migración
  push:
    paths:
      - "backend/alembic/versions/**"
  workflow_dispatch: # Permite lanzarlo manualmente desde la UI

jobs:
  dump-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fitflow_db
          POSTGRES_USER: fitflow_admin
          POSTGRES_PASSWORD: ${{ secrets.PG_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fitflow_admin -d fitflow_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para auto-commit en misma rama

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          uv pip install -r backend/requirements_backend.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://fitflow_admin:159753Lu@localhost:5432/fitflow_db
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Dump schema.sql
        env:
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          pg_dump -h localhost -U fitflow_admin -d fitflow_db \
            --schema-only --no-owner > schema.sql

      - name: Commit updated schema.sql
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(schema): auto-update schema.sql after migrations"
          file_pattern: schema.sql
