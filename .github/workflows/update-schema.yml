name: Validate migration schema artifact

on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  push:
    branches:
      - develop
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic CI-only values, never from real/staging accounts.
      DATABASE_URL: postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/fitflow_db
      SECRET_KEY: fitflow-ci-only-signing-key
      ENV: test
      TESTING: "true"
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_db
          POSTGRES_USER: fitflow_admin
          POSTGRES_PASSWORD: fitflow-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_admin -d fitflow_db"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact event revision (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.17"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"

      - name: Install runtime dependencies from repository lock export
        run: |
          set -euo pipefail
          uv pip install --system --no-cache-dir -r backend/requirements_backend.txt
          python -m pip check

      - name: Upgrade disposable PostgreSQL to exact Alembic head
        working-directory: backend
        run: alembic upgrade head

      - name: Generate and verify deterministic SQL schema
        env:
          PGPASSWORD: fitflow-ci-postgres
        shell: bash
        run: |
          set -euo pipefail
          pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges -f /tmp/fitflow-schema-first.sql
          pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges -f /tmp/fitflow-schema-second.sql
          # PostgreSQL 15.19+ emits a different random psql restrict guard per dump.
          # Compare SQL excluding ONLY those two guard tokens; retain full original
          # protected dump in the review artifact (never use a fixed security key).
          diff -u <(grep -vE '^\\(un)?restrict ' /tmp/fitflow-schema-first.sql) <(grep -vE '^\\(un)?restrict ' /tmp/fitflow-schema-second.sql)
          test -s /tmp/fitflow-schema-first.sql
          cp /tmp/fitflow-schema-first.sql schema.sql
          sha256sum schema.sql
          echo "FF_SCHEMA_SEMANTIC_COMPARISON_PASS"
          echo "FF_SCHEMA_SUBJECT_SHA=$(git rev-parse HEAD)"
          echo "FF_SCHEMA_SUBJECT_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Publish schema.sql for reviewer, never auto-commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fitflow-schema-sql-${{ github.run_id }}
          path: schema.sql
          retention-days: 14
          if-no-files-found: error
