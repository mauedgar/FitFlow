name: Validate migration schema (read-only)

# Schema changes are evidence for review; CI must never commit or push.
on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - ".github/workflows/update-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disposable CI-only credential; never points to staging or production.
      CI_EPHEMERAL_POSTGRES_PASSWORD: fitflow-ci-postgres
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fitflow_db
          POSTGRES_USER: fitflow_admin
          POSTGRES_PASSWORD: fitflow-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fitflow_admin -d fitflow_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout exact event subject, without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record immutable subject
        shell: bash
        run: |
          set -euo pipefail
          echo "subject_sha=$(git rev-parse HEAD)"
          echo "subject_tree=$(git rev-parse HEAD^{tree})"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install pinned backend dependencies
        run: |
          uv pip install --system -r backend/requirements_backend.txt

      - name: Upgrade disposable PostgreSQL 15 schema
        env:
          DATABASE_URL: postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/fitflow_db
        run: |
          set -euo pipefail
          cd backend
          alembic heads
          alembic upgrade head
          alembic current

      - name: Generate and compare read-only schema snapshots
        env:
          PGPASSWORD: fitflow-ci-postgres
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fitflow-schema"
          pg_dump --version
          pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema.sql"
          pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql"
          cmp "$RUNNER_TEMP/fitflow-schema/schema.sql" "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql"
          sha256sum "$RUNNER_TEMP/fitflow-schema/schema.sql" > "$RUNNER_TEMP/fitflow-schema/schema.sha256"
          printf 'subject_sha=%s\nsubject_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/fitflow-schema/subject.txt"
          test -z "$(git status --porcelain)"
          echo "SCHEMA_READ_ONLY_NO_COMMIT_PASS"

      - name: Upload schema review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitflow-schema-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fitflow-schema/schema.sql
            ${{ runner.temp }}/fitflow-schema/schema.sha256
            ${{ runner.temp }}/fitflow-schema/subject.txt
          if-no-files-found: error
          retention-days: 14
