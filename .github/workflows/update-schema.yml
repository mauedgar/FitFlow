name: Validate migration schema artifact

on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  push:
    branches:
      - develop
    paths:
      - "backend/alembic/versions/**"
      - "backend/alembic/env.py"
      - ".github/workflows/update-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic CI-only values, never from real/staging accounts.
      DATABASE_URL: postgresql+psycopg2://fitflow_admin:fitflow-ci-postgres@127.0.0.1:5432/fitflow_db
      SECRET_KEY: fitflow-ci-only-signing-key
      ENV: test
      TESTING: "true"
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_DB: fitflow_db
          POSTGRES_USER: fitflow_admin
          POSTGRES_PASSWORD: fitflow-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_admin -d fitflow_db"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact event revision (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.17"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"

      - name: Install runtime dependencies from repository lock export
        run: |
          set -euo pipefail
          uv pip install --system --no-cache-dir -r backend/requirements_backend.txt
          python -m pip check

      - name: Upgrade disposable PostgreSQL to exact Alembic head
        working-directory: backend
        run: alembic upgrade head

      - name: Generate reviewable schema with PostgreSQL 15 client, no Git write
        shell: bash
        env:
          PGPASSWORD: fitflow-ci-postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fitflow-schema"
          # A PG15 client matches disposable PG15 server (no runner-version drift).
          # Restrict guard keys MUST remain randomized in raw review artifacts.
          docker run --rm --network host --read-only --tmpfs /tmp postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump --version
          docker run --rm --network host --read-only --tmpfs /tmp -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema.sql"
          docker run --rm --network host --read-only --tmpfs /tmp -e PGPASSWORD="$PGPASSWORD" postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 pg_dump -h 127.0.0.1 -U fitflow_admin -d fitflow_db --schema-only --no-owner --no-privileges > "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql"
          # Compare SQL excluding ONLY the randomized psql restrict/unrestrict keys.
          # Never replace keys with a constant or remove them from the original dump.
          diff -u <(grep -vE '^\\(un)?restrict ' "$RUNNER_TEMP/fitflow-schema/schema.sql") <(grep -vE '^\\(un)?restrict ' "$RUNNER_TEMP/fitflow-schema/schema-repeat.sql")
          test -s "$RUNNER_TEMP/fitflow-schema/schema.sql"
          (cd "$RUNNER_TEMP/fitflow-schema" && sha256sum schema.sql > schema.sha256)
          printf 'subject_sha=%s\nsubject_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/fitflow-schema/subject.txt"
          test -z "$(git status --porcelain)"
          echo "FF_SCHEMA_READONLY_NO_COMMIT_PASS"
          echo "FF_SCHEMA_SEMANTIC_COMPARISON_PASS"
          cat "$RUNNER_TEMP/fitflow-schema/subject.txt"
          cat "$RUNNER_TEMP/fitflow-schema/schema.sha256"

      - name: Publish schema.sql for reviewer, never auto-commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fitflow-schema-sql-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fitflow-schema/schema.sql
            ${{ runner.temp }}/fitflow-schema/schema.sha256
            ${{ runner.temp }}/fitflow-schema/subject.txt
          retention-days: 14
          if-no-files-found: error
