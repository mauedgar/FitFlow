name: FitFlow deterministic validation v0

on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact FitFlow commit SHA to validate
        required: true
        type: string
      expected_tree:
        description: Optional exact FitFlow tree OID
        required: false
        default: ''
        type: string
      operation_id:
        description: Optional Product operation correlation id
        required: false
        default: ''
        type: string
      execution_attempt_id:
        description: Optional execution attempt correlation id
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fitflow_test
          POSTGRES_USER: fitflow_test_user
          POSTGRES_PASSWORD: fitflow_test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow_test_user -d fitflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      ENV: test
      TESTING: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://fitflow_test_user:fitflow_test_password@127.0.0.1:5432/fitflow_test
      SECRET_KEY: fitflow-test-only-secret-key
      REDIS_URL: redis://127.0.0.1:6379/0
      MEDIA_DIR: /tmp/fitflow-media
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider --basetemp=/tmp/pytest

    steps:
      - name: Checkout exact FitFlow subject
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact checkout
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          if [ "$observed" != "$SUBJECT_SHA" ]; then
            echo "SUBJECT_MISMATCH expected=$SUBJECT_SHA observed=$observed" >&2
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements_test.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements_test.txt

      - name: Bootstrap fresh database schema
        working-directory: backend
        run: alembic upgrade head

      - name: Run FitFlow deterministic validation
        id: validation
        continue-on-error: true
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          OPERATION_ID: ${{ inputs.operation_id }}
          EXECUTION_ATTEMPT_ID: ${{ inputs.execution_attempt_id }}
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          args=(
            --repository "$GITHUB_REPOSITORY"
            --subject-sha "$SUBJECT_SHA"
            --request-output "$RECEIPT_DIR/request.json"
            --receipt-output "$RECEIPT_DIR/receipt.json"
          )
          if [ -n "$EXPECTED_TREE" ]; then
            args+=(--expected-tree "$EXPECTED_TREE")
          fi
          if [ -n "$OPERATION_ID" ] || [ -n "$EXECUTION_ATTEMPT_ID" ]; then
            args+=(--operation-id "$OPERATION_ID" --execution-attempt-id "$EXECUTION_ATTEMPT_ID")
          fi
          python scripts/ci/fitflow_deterministic_validation.py "${args[@]}"

      - name: Checkout portable validation contract v0
        if: always()
        uses: actions/checkout@v4
        with:
          repository: mauedgar/tecnotron-ai
          ref: f28c812cff4d9c6dd27d71a084fbccfffbadd735
          path: .tecnotron-contract-v0
          persist-credentials: false

      - name: Set up Node 22 for contract validation
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned contract runtime
        if: always()
        working-directory: .tecnotron-contract-v0
        run: npm ci --ignore-scripts --omit=dev

      - name: Validate portable request and receipt
        if: always()
        env:
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const contract = require('./.tecnotron-contract-v0/src/contracts/deterministic-validation');
          const dir = process.env.RECEIPT_DIR;
          const request = JSON.parse(fs.readFileSync(`${dir}/request.json`, 'utf8'));
          const receipt = JSON.parse(fs.readFileSync(`${dir}/receipt.json`, 'utf8'));
          contract.DeterministicValidationRequest.parse(request);
          contract.DeterministicValidationReceipt.parse(receipt);
          console.log('PORTABLE_CONTRACT_VALIDATION_PASS');
          NODE

      - name: Upload deterministic validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitflow-deterministic-validation-${{ inputs.subject_sha }}
          path: ${{ runner.temp }}/fitflow-deterministic-validation
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate validation conclusion
        if: always()
        env:
          RECEIPT_DIR: ${{ runner.temp }}/fitflow-deterministic-validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          receipt_path = Path(os.environ["RECEIPT_DIR"]) / "receipt.json"
          if not receipt_path.is_file():
              print("VALIDATION_RECEIPT_MISSING", file=sys.stderr)
              raise SystemExit(2)

          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          conclusion = receipt.get("conclusion")
          print(f"VALIDATION_CONCLUSION={conclusion}")
          raise SystemExit(0 if conclusion == "PASS" else 1)
          PY
