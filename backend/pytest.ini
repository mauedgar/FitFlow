[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
asyncio_mode = auto
markers =
    smoke: harness/application startup and critical wiring
    unit: isolated business/schema/service tests
    integration: database, CRUD and transactional integration tests
    api: FastAPI/HTTP contract tests
    concurrency: locking/race-condition/integrity tests
    slow: intentionally slower tests excluded from fast feedback when needed
norecursedirs =
    .git
    .venv
    .venv_backend
    _templates
    __pycache__
