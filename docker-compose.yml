services:
  # --- NUEVO SERVICIO BACKEND ---
  backend:
    build: . # Le dice a Docker que construya la imagen usando el Dockerfile en el directorio actual
    container_name: fitflow-backend-1
    command: /app/start.sh # El comando para iniciar
    volumes:
      - ./backend:/app # Monta tu código local en el contenedor para desarrollo en vivo
    ports:
      - "8000:8000" # Mapea el puerto 8000 del contenedor a tu máquina
    environment:
      - DATABASE_URL=postgresql://fitflow_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@fitflow_postgres:5432/fitflow_db
      - REDIS_URL=redis://redis:6379/0
    networks:
      - fitflow_network
    depends_on:
      postgres:
        condition: service_healthy # Se asegura de que el contenedor de postgres se inicie antes que el backend
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fitflow_postgres
    restart: always
    environment:
      POSTGRES_DB: fitflow_db
      POSTGRES_USER: fitflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Se toma del .env raiz (ver .env.example). Solo aplica al primer inicio del volumen postgres_data.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitflow_network

    healthcheck: # --- LÍNEAS NUEVAS AQUÍ ---
      test: ["CMD-SHELL", "pg_isready -U fitflow_admin -d fitflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Adminer para gestión de base de datos (opcional pero útil)
  adminer:
    image: adminer
    container_name: fitflow_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - fitflow_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:

networks:
  fitflow_network:
    driver: bridge
