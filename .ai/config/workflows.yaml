schema_version: fitflow-workflow-registry/v2
# External implementation bindings are intentionally unbound here.
# Tecnotron owns external realization; FitFlow preserves only its workflow model.
workflows:
  development:
    status: active_specification
    states: [PLANNING, ROUTING, EXPLORING, EXECUTING, VALIDATING, REVIEWING, DOC_SYNC, PENDING_ACCEPTANCE]
  bugfix:
    status: active_specification
    states: [PLANNING, ROUTING, EXPLORING, EXECUTING, VALIDATING, REVIEWING, DOC_SYNC, PENDING_ACCEPTANCE]
  documentation_sync:
    status: active_specification
    states: [EXPLORING, VALIDATING, REVIEWING, DOC_SYNC, PENDING_ACCEPTANCE]
  orchestrator_workers:
    status: disabled
    phase: future
