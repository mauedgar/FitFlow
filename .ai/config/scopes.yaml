schema_version: fitflow-scopes/v2
scopes:
  backend:
    roots: [backend]
    initial_context_token_ceiling: 8000
  frontend:
    roots: [frontend]
    initial_context_token_ceiling: 8000
  mixed:
    roots: [backend, frontend, docs]
    initial_context_token_ceiling: 12000
  docs_tooling:
    roots: [docs, .ai, .agents]
    initial_context_token_ceiling: 6000
consumer_profiles:
  implementation:
    include_tests: targeted
  review:
    include_tests: affected
  test:
    include_tests: required
default_exclusions:
  - .git/**
  - .venv*/**
  - backend/.venv_backend/**
  - ../FitFlow-ai/python/.venv_tools/**
  - node_modules/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
  - '**/.ruff_cache/**'
  - dist/**
  - build/**
  - docs/archive/**
  - .ai/local/**
  - .ai/runs/**
  - exports/**
  - storage/**
  - qdrant_storage/**
  - .repo-packager-cache/**
  - logs/**
  - '**/.env'
  - '**/.env.*'
  - '**/*.key'
  - '**/*.pem'
  - '**/*.p12'
  - '**/*.sqlite*'
docs_filter:
  require_machine_context: true
expanded_mode:
  max_paths: 10
  overflow_behavior: partial_with_omitted_paths
