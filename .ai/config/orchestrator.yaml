schema_version: fitflow-orchestrator/v2
baseline: fitflow-ai/vnext-5.0
runtime:
  port: AgentRuntimePort
  preferred_adapter: opencode
  adapter_status: accepted_pending_conformance
control:
  planner: developer
  terminal_agent_state: PENDING_ACCEPTANCE
  final_state: DONE
  final_actor: developer
  commits_by_agents: false
  dependency_changes_by_agents: false
states:
  - BACKLOG
  - READY
  - PLANNING
  - ROUTING
  - EXPLORING
  - EXECUTING
  - VALIDATING
  - REVIEWING
  - DOC_SYNC
  - PENDING_ACCEPTANCE
  - WAITING_DEVELOPER
  - DONE
  - BLOCKED
  - BLOCKED_HIGH_RISK
  - CANCELLED
transitions:
  BACKLOG: [READY, CANCELLED]
  READY: [PLANNING, CANCELLED]
  PLANNING: [ROUTING, WAITING_DEVELOPER, BLOCKED, BLOCKED_HIGH_RISK, CANCELLED]
  ROUTING: [EXPLORING, EXECUTING, WAITING_DEVELOPER, BLOCKED, BLOCKED_HIGH_RISK]
  EXPLORING: [EXECUTING, EXPLORING, ROUTING, PLANNING, BLOCKED]
  EXECUTING: [VALIDATING, ROUTING, EXPLORING, PLANNING, BLOCKED, BLOCKED_HIGH_RISK]
  VALIDATING: [REVIEWING, ROUTING, EXPLORING, PLANNING, BLOCKED, BLOCKED_HIGH_RISK]
  REVIEWING: [DOC_SYNC, ROUTING, EXPLORING, PLANNING, WAITING_DEVELOPER, BLOCKED]
  DOC_SYNC: [PENDING_ACCEPTANCE, ROUTING, WAITING_DEVELOPER, BLOCKED]
  PENDING_ACCEPTANCE: [DONE, ROUTING, PLANNING, BLOCKED, CANCELLED]
  WAITING_DEVELOPER: [PLANNING, ROUTING, PENDING_ACCEPTANCE, BLOCKED, CANCELLED]
  BLOCKED: [READY, CANCELLED]
  BLOCKED_HIGH_RISK: [READY, CANCELLED]
limits:
  context_expansions: 2
  implementation_attempts: 2
  review_attempts: 2
parallelism:
  enabled: true
  require_disjoint_ownership_keys: true
  single_writer_per_key: true
artifacts:
  task_root: .ai/tasks
  run_root: .ai/runs
  local_root: .ai/local
  schema_root: .ai/contracts/v2
